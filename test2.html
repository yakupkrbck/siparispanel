<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CiroLog PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:#0b0b12;
  color:#fff;
}

/* HEADER */
.header{
  padding:16px;
  font-size:22px;
  font-weight:800;
}

/* CARD */
.card{
  margin:16px;
  padding:20px;
  border-radius:14px;
  background:rgba(20,20,30,.65);
  backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.06);
  box-shadow:0 12px 40px rgba(0,0,0,.7);
}

/* INPUT */
input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  background:#1a1a24;
  color:#fff;
}

/* BUTTON */
button{
  margin-top:12px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:800;
  background:linear-gradient(135deg,#ff2e63,#ff8a5b);
  color:#fff;
}

/* STATS */
.stat{
  font-size:28px;
  font-weight:800;
}

.list{
  margin-top:10px;
  font-size:14px;
  opacity:.85;
  max-height:200px;
  overflow:auto;
}
</style>
</head>

<body>

<div class="header">CiroLog PRO 🚀</div>

<div class="card">
  <div>Günlük Ciro</div>
  <input type="date" id="date">
  <input type="number" id="amount" placeholder="₺">
  <button onclick="save()">Kaydet</button>
</div>

<div class="card">
  <div>Toplam Ciro</div>
  <div class="stat" id="total">₺0</div>
  <div id="analysis"></div>
</div>

<div class="card">
  <div>Kayıtlar</div>
  <div id="list" class="list"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* SENİN CONFIG */
const cfg={
  apiKey:'AIzaSyD2CPjkui-HSM9WG0eh0olu6uidA0RrP10',
  authDomain:'siparispanel-a4c6e.firebaseapp.com',
  projectId:'siparispanel-a4c6e'
};

const app=initializeApp(cfg);
const auth=getAuth(app);
const db=getFirestore(app);

let cu=null;
let records=[];

/* LOGIN (anonim) */
signInAnonymously(auth);

onAuthStateChanged(auth,user=>{
  if(user){
    cu=user;
    listen();
  }
});

/* REALTIME */
function listen(){
  const ref=collection(db,`cirolog_records/${cu.uid}/entries`);
  const q=query(ref,orderBy("createdAt","desc"));

  onSnapshot(q,snap=>{
    records=[];
    let total=0;
    let html="";

    snap.forEach(doc=>{
      let d=doc.data();
      records.push(d);
      total+=d.amount;
      html+=`${d.date} → ₺${d.amount}<br>`;
    });

    document.getElementById("total").innerText="₺"+total;
    document.getElementById("list").innerHTML=html;

    analyze();
  });
}

/* SAVE */
window.save=async function(){
  let date=document.getElementById("date").value;
  let amount=document.getElementById("amount").value;

  if(!date||!amount) return alert("Eksik veri");

  await addDoc(collection(db,`cirolog_records/${cu.uid}/entries`),{
    date:date,
    amount:Number(amount),
    createdAt:new Date()
  });

  document.getElementById("amount").value="";
}

/* ANALİZ */
function analyze(){
  if(records.length<5){
    document.getElementById("analysis").innerText="Veri az";
    return;
  }

  let avg=records.reduce((a,b)=>a+b.amount,0)/records.length;

  let trend=records[0].amount > records[4].amount;

  if(avg>5000){
    document.getElementById("analysis").innerText="🔥 Satış çok iyi";
  }else if(trend){
    document.getElementById("analysis").innerText="📈 Yükseliş var";
  }else{
    document.getElementById("analysis").innerText="⚠️ Düşüş olabilir";
  }
}
</script>

</body>
</html>
